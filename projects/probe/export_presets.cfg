[preset.0]

name="Quest (arm64, OpenXR)"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../build/vrge_probe.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.flamti.vrge.probe"
package/name="VRGE Probe"
package/signed=true
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
xr_features/xr_mode=1
; Загрузчик OpenXR и записи манифеста (IMMERSIVE_HMD, headtracking) НЕ входят
; в штатный Android-экспорт Godot 4.7: xr_features/xr_mode влияет только на
; командную строку движка (export_plugin.cpp:3246-3252). Их даёт плагин
; GodotVR/godot_openxr_vendors через .aar, а .aar вливается только gradle-сборкой.
; Поэтому use_gradle_build=true обязателен.
xr_features/enable_meta_plugin=true
xr_features/quest_3_support=true
xr_features/passthrough=0
xr_features/hand_tracking=0
