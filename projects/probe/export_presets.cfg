version/code=1
version/name="0.1.0"
screen/immersive_mode=true
xr_features/xr_mode=1
; Загрузчик OpenXR и записи манифеста (IMMERSIVE_HMD, headtracking) НЕ входят
; в штатный Android-экспорт Godot 4.7: xr_features/xr_mode влияет только на
; командную строку движка (export_plugin.cpp:3246-3252). Их даёт плагин
; GodotVR/godot_openxr_vendors через .aar, а .aar вливается только gradle-сборкой.
; Поэтому use_gradle_build=true обязателен.
xr_features/enable_meta_plugin=true
; Вендорские фичи живут в пространстве meta_xr_features/, а НЕ xr_features/.
; Здесь стояли xr_features/quest_3_support, /passthrough, /hand_tracking — таких
; опций не существует ни у Godot, ни у плагина. Godot знает только
; xr_features/xr_mode (export_plugin.cpp:2257), всё остальное регистрирует
; плагин под своим префиксом. Значения молча игнорировались, APK собирался на
; умолчаниях плагина. Обошлось без последствий — quest3 и так в
; com.oculus.supportedDevices по умолчанию, — но выяснено это разбором
; манифеста через aapt2, а не чтением пресета.
meta_xr_features/quest_3_support=true
meta_xr_features/passthrough=0
; 1 = Optional (значения плагина: None,Optional,Required, то есть Optional:1,
; Required:2 — взято из строк libgodotopenxrvendors.so, не из памяти).
; Без объявленного отслеживания рук оболочка Quest ПЕРЕХВАТЫВАЕТ запуск:
; common_system_dialog_app_launch_blocked_controller_required. Приложение не
; стартует вообще — ни лога, ни отчёта, и выглядит это как «прогон дал пусто».
; Прибору ввод не нужен; объявление снимает требование включённых контроллеров
; и делает прогон возможным без участия человека.
meta_xr_features/hand_tracking=1
